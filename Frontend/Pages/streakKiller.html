<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBD Streak Tracker - Killer</title>
    <link rel="icon" type="image/x-icon" href="/Images/Miscellaneous/Logo_DBD.ico">
    <link rel="stylesheet" href="/CSS/main.css" />
    <link rel="stylesheet" href="/CSS/pages/streak.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet" />
</head>

<body data-page="streak" data-mode="killer">
    <div id="loadingScreen">Loading...</div>

    <nav id="navbar">
        <div class="navLeft">
            <button id="homeButton" class="navBtn ghost">
                <span class="navIcon">⌂</span> Home
            </button>
            <div id="navLogo">
                <img src="/Images/Miscellaneous/Logo_DBD.png" alt="DBD Logo" class="logoIcon">
                <span>DBD TRACKER</span>
            </div>
        </div>

        <div class="navCenter">
            <span class="navIcon">👥</span>
            <span id="modeIndicator" class="navDropdown"></span>
        </div>

        <div class="navRight">
            <span id="welcomeUser" class="userBadge">👑</span>
            <button id="profileButton" class="navBtn ghost">Profile</button>
            <button id="logoutButton" class="navBtn ghost">Logout</button>
        </div>
    </nav>

    <div id="titleAndRules">
        <h1 id="streakTitle"></h1>
        <div id="ruleset"></div>
    </div>

    <div class="matchEntry">
        <div class="flex-column-center">
            <div class="nickAndChar" id="killerInfo">
                <h2 class="nickname">Killer</h2>
                <img class="characterPortrait" id="killerImage" src="/Images/Miscellaneous/Icon_Killer.png" alt="Killer"
                    title="Killer">
            </div>
            <div class="perkBuilder">
                <div class="card">
                    <h2 class="perkBuilderTitle">Killer's build</h2>
                    <div class="perkSlots">
                        <div class="perkSlot" id="killerPerkSlot1">
                            <label for="killerPerk1" class="perkNumberText">Perk 1:</label>
                            <select id="killerPerk1"></select>
                        </div>
                        <div class="perkSlot" id="killerPerkSlot2">
                            <label for="killerPerk2" class="perkNumberText">Perk 2:</label>
                            <select id="killerPerk2"></select>
                        </div>
                        <div class="perkSlot" id="killerPerkSlot3">
                            <label for="killerPerk3" class="perkNumberText">Perk 3:</label>
                            <select id="killerPerk3"></select>
                        </div>
                        <div class="perkSlot" id="killerPerkSlot4">
                            <label for="killerPerk4" class="perkNumberText">Perk 4:</label>
                            <select id="killerPerk4"></select>
                        </div>
                    </div>
                    <div class="addonSlots">
                        <div class="addonSlot" id="addonSlot1">
                            <label for="killerAddon1" class="addonNumberText">Add-on 1:</label>
                            <select id="killerAddon1"></select>
                        </div>
                        <div class="addonSlot" id="addonSlot2">
                            <label for="killerAddon2" class="addonNumberText">Add-on 2:</label>
                            <select id="killerAddon2"></select>
                        </div>
                    </div>
                    <div class="presetControls">
                        <input type="text" placeholder="Preset Name" id="presetNameKiller">
                        <button class="presetButton" id="savePresetKiller">Save Preset</button>
                        <select id="presetListKiller">
                            <option value="">Load Preset</option>
                        </select>
                        <button class="presetButton" id="deletePresetKiller">Delete Preset</button>
                    </div>
                    <div class="mapImageSection">
                        <img id="mapImage" src="/Images/Maps/Map_GenericMapBackground.png" alt="DBD Map">
                    </div>
                </div>
            </div>
            <div id="killsSection">
                <label for="kills" class="killsText" id="killsCountText">Kills:</label>
                <input type="number" id="kills" min="0" max="4" placeholder="(0 - 4)">
            </div>
        </div>
    </div>

    <div id="infoAndStats" class="dashboard-grid">

        <div id="matchInfoSection" class="dashboard-card">
            <h2 class="card-title"><span class="icon-purple">🎯</span> MATCH INFO</h2>
            <div class="card-content">
                <div id="mapAndKiller" class="input-row">
                    <div class="inputGroup">
                        <label for="mapName">Map</label>
                        <select id="mapName" class="dark-input"></select>
                    </div>
                </div>

                <div class="bottomButtons side-by-side-row">
                    <button id="submitMatchButton" class="btn-submit">✓ Submit Match</button>
                    <button class="hidden" id="cancelEditButton">Cancel Editing</button>
                    <button id="clearMatchesButton" class="btn-ghost">🗑️ Clear All Matches</button>
                </div>

                <div id="deleteMatch" class="delete-row">
                    <div class="input-with-label">
                        <span class="prefix">Match #</span>
                        <input type="number" id="deleteMatchNumber" placeholder="e.g. 12" min="1"
                            class="dark-input num-input">
                    </div>
                    <button id="deleteMatchButton" class="btn-danger">Delete Match</button>
                </div>
            </div>
        </div>

        <div id="streakStatsSection" class="dashboard-card">
            <h2 class="card-title"><span class="icon-purple">🔥</span> STREAK STATS</h2>
            <div class="card-content streak-content">
                <div id="streakStats" class="streak-wrapper">
                    <div class="streak-box">
                        <span class="streak-label">CURRENT STREAK</span>
                        <div class="streak-value">
                            <span class="icon-fire">🔥</span>
                            <span id="currentStreak" class="text-green">0</span>
                        </div>
                    </div>
                    <div class="streak-divider"></div>
                    <div class="streak-box">
                        <span class="streak-label">BEST STREAK</span>
                        <div class="streak-value">
                            <span class="icon-trophy">🏆</span>
                            <span id="bestStreak" class="text-purple">0</span>
                        </div>
                    </div>
                </div>
                <button id="resetBestStreakButton" class="btn-ghost-purple">✏️ Reset Best Streak</button>
            </div>
        </div>
    </div>

    <table id="matchTable">
        <thead></thead>
        <tbody id="matchTableBody"></tbody>
    </table>

    <script type="module" src="/JS/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</body>

</html>
