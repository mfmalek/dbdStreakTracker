<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBD Streak Tracker - Duo</title>
    <link rel="icon" type="image/x-icon" href="/Images/Miscellaneous/Logo_DBD.ico">
    <link rel="stylesheet" href="/CSS/main.css" />
    <link rel="stylesheet" href="/CSS/pages/streak.css" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet" />
</head>

<body data-page="streak" data-mode="duo">
    <div id="loadingScreen">Loading...</div>

    <nav id="navbar">
        <div class="navLeft">
            <button id="homeButton" class="navBtn ghost">
                <span class="navIcon">⌂</span> Home
            </button>
            <div id="navLogo">
                <img src="/Images/Miscellaneous/Logo_DBD.png" alt="DBD Logo" class="logoIcon">
                <span>DBD TRACKER</span>
            </div>
        </div>

        <div class="navCenter">
            <span class="navIcon">👥</span>
            <button id="modeIndicator" class="navDropdown"></button>
        </div>

        <div class="navRight">
            <span id="welcomeUser" class="userBadge">👑</span>
            <button id="profileButton" class="navBtn ghost">Profile</button>
            <button id="logoutButton" class="navBtn ghost">Logout</button>
        </div>
    </nav>

    <div id="titleAndRules">
        <h1 id="streakTitle"></h1>
        <div id="ruleset"></div>
    </div>

    <div class="matchEntry">
        <div id="survivorContainer"></div>

        <div class="character-wrapper">
            <div class="card killer-card">
                <div class="card-header">
                    <div class="header-info">
                        <div class="role-icon killer-icon">
                            <img src="/Images/Miscellaneous/Icon_Killer.png" alt="Killer"
                                style="filter: invert(1); width: 24px;">
                        </div>
                        <div class="name-role">
                            <h2 class="nickname">KILLER</h2>
                        </div>
                    </div>
                    <button class="icon-btn edit-btn">✎</button>
                </div>

                <div class="card-body">
                    <div class="build-section">
                        <h2 class="perkBuilderTitle">Killer's Build</h2>
                        <div class="perkSlots-row">
                            <div class="perkSlot wrapper">
                                <div class="perk-diamond killer-diamond">
                                    <span class="plus-icon">+</span>
                                    <select id="killerPerk1" class="hidden-select"></select>
                                </div>
                                <label class="perkNumberText">PERK 1</label>
                            </div>
                            <div class="perkSlot wrapper">
                                <div class="perk-diamond killer-diamond">
                                    <span class="plus-icon">+</span>
                                    <select id="killerPerk2" class="hidden-select"></select>
                                </div>
                                <label class="perkNumberText">PERK 2</label>
                            </div>
                            <div class="perkSlot wrapper">
                                <div class="perk-diamond killer-diamond">
                                    <span class="plus-icon">+</span>
                                    <select id="killerPerk3" class="hidden-select"></select>
                                </div>
                                <label class="perkNumberText">PERK 3</label>
                            </div>
                            <div class="perkSlot wrapper">
                                <div class="perk-diamond killer-diamond">
                                    <span class="plus-icon">+</span>
                                    <select id="killerPerk4" class="hidden-select"></select>
                                </div>
                                <label class="perkNumberText">PERK 4</label>
                            </div>
                        </div>
                    </div>

                    <div class="mapImageSection">
                        <img id="mapImage" src="/Images/Maps/Map_GenericMapBackground.png" alt="DBD Map">
                        <div class="map-label">MAP PREVIEW</div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="infoAndStats" class="bottomInfo">
        <div id="matchInfoSection">
            <h2>Match Info</h2>
            <div id="mapAndKiller">
                <div class="inputGroup">
                    <label for="killerName">Killer:</label>
                    <select id="killerName" placeholder="Select Killer"></select>
                </div>
                <div class="inputGroup">
                    <label>Map:</label>
                    <select id="mapName" placeholder="Select Map"></select>
                </div>
            </div>

            <div class="bottomButtons">
                <button id="submitMatchButton">Submit Match</button>
                <button class="hidden" id="cancelEditButton">Cancel Editing</button>
                <button id="clearMatchesButton">Clear All Matches</button>
                <div id="deleteMatch">
                    <input type="number" id="deleteMatchNumber" placeholder="Match #" min="1">
                    <button id="deleteMatchButton">Delete Match</button>
                </div>
            </div>
        </div>

        <div id="streakStatsSection">
            <h2>Streak Stats</h2>
            <div id="streakStats">
                <h3>🔥 Current Streak: <span id="currentStreak"></span></h3><br>
                <h3>🏆 Best Streak: <span id="bestStreak"></span></h3>
            </div>
            <button class="bottomButtons" id="resetBestStreakButton">Reset Best Streak</button>
        </div>

        <div id="groupSection">
            <h2>Group</h2>

            <div class="inviteControls">
                <input type="text" id="inviteUsername" placeholder="Enter username" />
                <button id="inviteButton">Invite</button>
            </div>

            <div id="groupMembersContainer"></div>

            <div id="invitesList">
                <h3>Pending Invites</h3>
                <ul id="invitesContainer"></ul>
            </div>
        </div>
    </div>

    <table id="matchTable">
        <thead></thead>
        <tbody id="matchTableBody"></tbody>
    </table>

    <script type="module" src="/JS/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</body>

</html>
